name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set website base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: echo "VITE_BASE_PATH=${PAGES_BASE_PATH%/}/" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check tracking display
        run: npm test

      - name: Build website
        env:
          VITE_SERVICE_API_URL: ${{ vars.FANAAR_API_URL }}
          VITE_ADMIN_LOGIN_URL: ${{ vars.FANAAR_ADMIN_URL }}
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
